name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm tauri:build

      - name: Resolve release tag (for filenames)
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if (-not $tag) {
            throw "Release tag is required."
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Prepare portable executable name
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/target/release/pageatlas.exe") {
            $tagNoV = "$env:RELEASE_TAG" -replace '^v',''
            $portableName = "PageAtlas_${tagNoV}_x64-portable.exe"
            Copy-Item "src-tauri/target/release/pageatlas.exe" "src-tauri/target/release/$portableName" -Force
            "PORTABLE_EXE_NAME=$portableName" >> $env:GITHUB_ENV
          }

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pageatlas-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/${{ env.PORTABLE_EXE_NAME }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [ -z "$tag" ]; then
            echo "Release tag is required."
            exit 1
          fi

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PageAtlas ${{ env.RELEASE_TAG }}
          files: dist/**
          body_path: .github/release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
